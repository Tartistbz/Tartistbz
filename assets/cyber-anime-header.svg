<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Tartistbz cyber anime profile header</title>
  <desc id="desc">A neon cyberpunk anime-inspired profile banner with a moon, city grid, and system interface.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18" />
      <stop offset="0.58" stop-color="#130d27" />
      <stop offset="1" stop-color="#062331" />
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="0.3" stop-color="#ff0055" />
      <stop offset="0.68" stop-color="#03d8f3" />
      <stop offset="1" stop-color="#03d8f3" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4a3" />
      <stop offset="1" stop-color="#fcee0c" />
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1a3650" stroke-width="1" />
    </pattern>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="18" y="18" width="1244" height="384" rx="20" />
    </clipPath>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#050711" />
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#sky)" />
    <rect width="1280" height="420" fill="url(#grid)" opacity="0.52" />

    <path d="M0 330H1280" stroke="url(#horizon)" stroke-width="2" opacity="0.92" filter="url(#glow-cyan)" />
    <path d="M0 342H1280" stroke="#ff0055" stroke-width="1" opacity="0.4" />
    <path d="M0 365H1280" stroke="#03d8f3" stroke-width="1" opacity="0.22" />

    <circle cx="1032" cy="123" r="112" fill="#fcee0c" opacity="0.1" filter="url(#glow-pink)" />
    <circle cx="1032" cy="123" r="76" fill="url(#moon)" opacity="0.94" />
    <path d="M985 82c18 10 28 26 23 41-5 16-27 20-40 35 17 17 38 25 61 24 33-2 60-22 71-51-5 38-37 68-76 72-45 5-85-26-92-70-5-29 8-58 31-75 6 9 13 17 22 24Z" fill="#161329" opacity="0.78" />

    <g opacity="0.8">
      <path d="M770 64l140 0" stroke="#03d8f3" stroke-width="2" />
      <path d="M770 72l78 0" stroke="#ff0055" stroke-width="1" />
      <path d="M770 80l112 0" stroke="#03d8f3" stroke-width="1" opacity="0.5" />
      <text x="770" y="52" fill="#c7f7ff" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3">SIGNAL // 2077</text>
    </g>

    <g fill="#08111e" stroke="#03d8f3" stroke-width="1" opacity="0.94">
      <path d="M0 317V276h35v41h20v-68h38v68h19v-28h25v28h16v-91h38v91h21v-49h34v49h15v-79h46v79h22v-34h29v34h18v-57h36v57h28v-108h48v108h22v-38h28v38h25v-72h42v72h24v-52h36v52h21v-84h43v84h21v-30h31v30h24v-64h37v64h32v-97h48v97h23v-45h34v45h20v-66h42v66h23v-40h32v40h18v-74h43v74h22v-50h38v50h21v-94h44v94h22v-57h42v57h19v-80h44v80h20v-42h38v42h19v-71h46v71h16v-55h35v55h21v-85h48v85h30v-44h35v44h24v-65h48v65h16v-32h39v32H0Z" />
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M820 320c0-67 32-111 85-126 35-10 69-6 99 13 32 20 49 58 49 113" stroke="#ff0055" stroke-width="4" filter="url(#glow-pink)" />
      <path d="M855 315c8-55 28-92 59-106 29-13 58-10 84 7 25 17 37 47 39 99" stroke="#03d8f3" stroke-width="2" filter="url(#glow-cyan)" />
      <path d="M898 222c22 13 46 18 72 14 20-3 37-11 51-25" stroke="#fcee0c" stroke-width="2" />
      <path d="M913 257c15-13 31-18 48-16 17 2 30 10 41 24" stroke="#c7f7ff" stroke-width="3" />
      <path d="M945 248l-2 24M976 249l3 25" stroke="#ff0055" stroke-width="3" />
      <path d="M950 292c12 8 26 8 40-1" stroke="#ff0055" stroke-width="2" />
      <path d="M839 309c-27-17-42-42-44-76M1047 317c28-17 45-41 49-72" stroke="#ff0055" stroke-width="5" />
    </g>

    <g fill="#0a1020" stroke="#ff0055" stroke-width="2">
      <path d="M884 232c-20-39-12-93 24-124 29-24 69-27 105-9 24 12 42 34 50 59-29-19-57-23-83-14-27 9-48 29-61 58-8 18-19 29-35 30Z" />
      <path d="M867 184c-28-37-30-73-8-103 26 10 43 28 52 54-18 10-33 26-44 49Z" />
      <path d="M1035 168c24-27 47-37 73-31-6 28-23 52-49 69-4-13-12-25-24-38Z" />
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="76" y="86" fill="#03d8f3" font-size="13" letter-spacing="5">TARTISTBZ // PROFILE</text>
      <text x="72" y="164" fill="#ffffff" font-size="62" font-weight="700" letter-spacing="1">CODE <tspan fill="#03d8f3">LIKE</tspan></text>
      <text x="72" y="224" fill="#ff0055" font-size="62" font-weight="700" letter-spacing="1">ANIME.</text>
      <text x="76" y="259" fill="#d7e8f1" font-size="13" letter-spacing="3">BUILDING SMALL WORLDS WITH BIG IDEAS</text>

      <rect x="74" y="291" width="174" height="34" rx="6" fill="#ff0055" fill-opacity="0.14" stroke="#ff0055" />
      <circle cx="94" cy="308" r="5" fill="#fcee0c" filter="url(#glow-cyan)" />
      <text x="110" y="313" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ONLINE</text>

      <rect x="264" y="291" width="192" height="34" rx="6" fill="#03d8f3" fill-opacity="0.1" stroke="#03d8f3" />
      <text x="282" y="313" fill="#c7f7ff" font-size="12" letter-spacing="2">PYTHON // ACTIVE</text>

      <text x="1084" y="344" fill="#fcee0c" font-size="11" letter-spacing="3">NEON DISTRICT</text>
      <text x="1084" y="362" fill="#c7f7ff" font-size="10" letter-spacing="2">NO SLEEP / JUST SHIP</text>
    </g>

    <path d="M42 52h26M42 52v26M1238 52h-26M1238 52v26M42 368h26M42 368v-26M1238 368h-26M1238 368v-26" fill="none" stroke="#03d8f3" stroke-width="2" />
  </g>
  <rect x="18" y="18" width="1244" height="384" rx="20" fill="none" stroke="#03d8f3" stroke-opacity="0.7" />
  <rect x="25" y="25" width="1230" height="370" rx="16" fill="none" stroke="#ff0055" stroke-opacity="0.35" />
</svg>
